<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Intelligence Service</title>
  <meta name="description" content="Analyze any website URL and extract structured business intelligence instantly." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    #url-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
    }
    #url-input:focus { border-color: #6366f1; }

    #analyze-btn {
      padding: 0.7rem 1.5rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #analyze-btn:hover:not(:disabled) { background: #4f46e5; }
    #analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      min-height: 1.2em;
    }
    #status.error { color: #f87171; }
    #status.success { color: #34d399; }

    .results { display: none; }
    .results.visible { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .card h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6366f1;
      margin-bottom: 0.6rem;
    }

    .field { margin-bottom: 0.4rem; font-size: 0.88rem; }
    .field .label { color: #64748b; margin-right: 0.3rem; }
    .field .value { color: #e2e8f0; word-break: break-all; }
    .field .value a { color: #818cf8; text-decoration: none; }
    .field .value a:hover { text-decoration: underline; }

    .pill {
      display: inline-block;
      background: #1e3a5f;
      color: #93c5fd;
      border-radius: 999px;
      padding: 0.1rem 0.6rem;
      font-size: 0.78rem;
      margin: 0.15rem 0.1rem;
    }
    .pill.green { background: #14532d; color: #86efac; }
    .pill.purple { background: #2e1065; color: #c4b5fd; }

    .bool-yes { color: #34d399; font-weight: 600; }
    .bool-no  { color: #64748b; }

    details { margin-bottom: 1rem; }
    summary {
      cursor: pointer;
      font-size: 0.85rem;
      color: #94a3b8;
      padding: 0.5rem 0;
      user-select: none;
    }
    summary:hover { color: #e2e8f0; }

    pre {
      background: #0d1117;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.78rem;
      overflow: auto;
      max-height: 500px;
      color: #93c5fd;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Website Intelligence Service</h1>
    <p class="subtitle">Enter a website URL to extract structured business information.</p>

    <div class="input-row">
      <input
        id="url-input"
        type="url"
        placeholder="https://example.com"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="analyze-btn" onclick="analyze()">Analyze</button>
    </div>

    <p id="status"></p>

    <div id="results" class="results">
      <!-- Company -->
      <div class="grid">
        <div class="card" id="card-company">
          <h2>Company</h2>
          <div id="f-company"></div>
        </div>
        <div class="card" id="card-contact">
          <h2>Contact</h2>
          <div id="f-contact"></div>
        </div>
        <div class="card" id="card-social">
          <h2>Social</h2>
          <div id="f-social"></div>
        </div>
        <div class="card" id="card-seo">
          <h2>SEO</h2>
          <div id="f-seo"></div>
        </div>
        <div class="card" id="card-tech">
          <h2>Technology</h2>
          <div id="f-tech"></div>
        </div>
        <div class="card" id="card-pages">
          <h2>Pages Found</h2>
          <div id="f-pages"></div>
        </div>
      </div>

      <!-- Services -->
      <div class="card" style="margin-bottom:1rem">
        <h2>Services / Products</h2>
        <div id="f-services"></div>
      </div>

      <!-- Crawl meta -->
      <div class="card" style="margin-bottom:1.5rem">
        <h2>Crawl Info</h2>
        <div id="f-crawl"></div>
      </div>

      <!-- Raw JSON -->
      <details>
        <summary>▶ View raw JSON response</summary>
        <pre id="raw-json"></pre>
      </details>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    function field(label, value) {
      if (!value && value !== false) return '';
      return `<div class="field"><span class="label">${label}:</span><span class="value">${value}</span></div>`;
    }

    function boolField(label, value) {
      const display = value
        ? '<span class="bool-yes">✓ Yes</span>'
        : '<span class="bool-no">✗ No</span>';
      return `<div class="field"><span class="label">${label}:</span> ${display}</div>`;
    }

    function pills(items, cls = '') {
      if (!items || items.length === 0) return '<span class="bool-no">None detected</span>';
      return items.map(i => `<span class="pill ${cls}">${i}</span>`).join('');
    }

    function socialLink(platform, url) {
      if (!url) return '';
      return `<div class="field"><span class="label">${platform}:</span><span class="value"><a href="${url}" target="_blank" rel="noopener">${url}</a></span></div>`;
    }

    function render(data) {
      const c = data.company || {};
      document.getElementById('f-company').innerHTML =
        field('Name', c.name) +
        field('Tagline', c.tagline ? c.tagline.slice(0, 120) + (c.tagline.length > 120 ? '…' : '') : '') +
        field('Description', c.description ? c.description.slice(0, 150) + (c.description.length > 150 ? '…' : '') : '');

      const ct = data.contact || {};
      const emailsHtml = (ct.emails || []).length
        ? (ct.emails || []).map(e => `<a href="mailto:${e}">${e}</a>`).join(', ')
        : '<span class="bool-no">None</span>';
      const phonesHtml = (ct.phones || []).length
        ? (ct.phones || []).join(', ')
        : '<span class="bool-no">None</span>';
      document.getElementById('f-contact').innerHTML =
        `<div class="field"><span class="label">Emails:</span><span class="value">${emailsHtml}</span></div>` +
        `<div class="field"><span class="label">Phones:</span><span class="value">${phonesHtml}</span></div>` +
        boolField('Contact Form', ct.contact_form) +
        boolField('Booking', ct.booking);

      const s = data.social || {};
      document.getElementById('f-social').innerHTML =
        socialLink('LinkedIn', s.linkedin) +
        socialLink('Facebook', s.facebook) +
        socialLink('Instagram', s.instagram) +
        socialLink('Twitter/X', s.twitter) +
        socialLink('YouTube', s.youtube) +
        socialLink('TikTok', s.tiktok) +
        socialLink('GitHub', s.github) ||
        '<span class="bool-no">None detected</span>';

      const seo = data.seo || {};
      document.getElementById('f-seo').innerHTML =
        field('Title', seo.title) +
        field('Description', seo.description ? seo.description.slice(0, 120) + '…' : '') +
        field('Language', seo.language);

      const t = data.technology || {};
      document.getElementById('f-tech').innerHTML =
        field('CMS', t.cms || '<span class="bool-no">Unknown</span>') +
        `<div class="field"><span class="label">Analytics:</span> ${pills(t.analytics)}</div>` +
        `<div class="field"><span class="label">Widgets:</span> ${pills(t.widgets, 'purple')}</div>` +
        `<div class="field"><span class="label">Booking:</span> ${pills(t.booking, 'green')}</div>`;

      const pg = data.pages || {};
      document.getElementById('f-pages').innerHTML =
        boolField('Homepage', pg.homepage) +
        boolField('About', pg.about) +
        boolField('Services', pg.services) +
        boolField('Pricing', pg.pricing) +
        boolField('Contact', pg.contact);

      const svcs = data.services || [];
      document.getElementById('f-services').innerHTML = svcs.length
        ? svcs.map(s => `<span class="pill">${s}</span>`).join('')
        : '<span class="bool-no">None extracted</span>';

      const cr = data.crawl || {};
      document.getElementById('f-crawl').innerHTML =
        field('Pages scanned', cr.pages_scanned) +
        field('Time', cr.crawl_time_ms + ' ms');

      document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2);
      document.getElementById('results').classList.add('visible');
    }

    async function analyze() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) { setStatus('Please enter a URL.', 'error'); return; }

      const btn = document.getElementById('analyze-btn');
      btn.disabled = true;
      document.getElementById('results').classList.remove('visible');
      setStatus('⏳ Crawling and analyzing… this may take up to 20 seconds.', '');

      try {
        const res = await fetch(`${API_BASE}/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus(`Error: ${data.error || 'Request failed'} — ${data.details || ''}`, 'error');
          return;
        }

        setStatus(`✓ Analysis complete — ${data.crawl?.pages_scanned ?? 0} page(s) scanned in ${data.crawl?.crawl_time_ms ?? 0}ms`, 'success');
        render(data);

      } catch (err) {
        setStatus(`Network error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // Allow Enter key to submit
    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
